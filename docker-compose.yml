version: '3.8'


services:

  # ======================

  # DATABASE (MariaDB)

  # ======================

  db:

    image: mariadb:10.11

    volumes:

      - mysql_data:/var/lib/mysql

    environment:

      MARIADB_DATABASE: ${DB_NAME}

      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:

      - "3307:3306"   # ⚠️ à fermer via firewall en prod

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ======================

  # BACKUP AUTOMATIQUE DB
  # Dump compressé toutes les BACKUP_INTERVAL_HOURS heures dans ./backups,
  # rotation automatique après BACKUP_KEEP_DAYS jours.
  # Restauration : voir scripts/restore-db.sh

  # ======================

  db-backup:

    image: mariadb:10.11

    depends_on:

      db:

        condition: service_healthy

    environment:

      DB_NAME: ${DB_NAME}

      DB_PASSWORD: ${DB_PASSWORD}

      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}

      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}

    volumes:

      - ./backups:/backups

    entrypoint:
      - sh
      - -c
      - |
        echo "[backup] service démarré — intervalle $${BACKUP_INTERVAL_HOURS}h, rétention $${BACKUP_KEEP_DAYS} jours"
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          f="/backups/$${DB_NAME}_$${ts}.sql.gz"
          if mariadb-dump -h db -u root -p"$$DB_PASSWORD" \
               --single-transaction --routines --triggers --events \
               "$$DB_NAME" | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f"
            echo "[backup] OK : $$f ($$(du -h "$$f" | cut -f1))"
            find /backups -name '*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          else
            rm -f "$$f.tmp"
            echo "[backup] ECHEC : $$ts" >&2
          fi
          sleep $$(( BACKUP_INTERVAL_HOURS * 3600 ))
        done

    restart: unless-stopped


  # ======================

  # REDIS

  # ======================

  redis:

    image: redis:7-alpine

    ports:

      - "6379:6379"   # ⚠️ à fermer via firewall en prod

    healthcheck:

      test: ["CMD", "redis-cli", "ping"]

      interval: 5s

      timeout: 3s

      retries: 5


  # ======================

  # FRONTEND

  # ======================

  frontend:

    build: ./frontend

    volumes:

      - ./frontend:/app

      - /app/node_modules

    ports:

      - "8080:8080"

    environment:

      - VITE_API_URL=http://185.158.5.60:8000/api/

      - VITE_WS_URL=ws://185.158.5.60:8000/ws/

      - REACT_APP_API_URL=http://185.158.5.60:8000/api/

      - CHOKIDAR_USEPOLLING=true

    stdin_open: true

    tty: true


  # ======================

  # BACKEND (Django)

  # ======================

  backend:

    build: ./gsbackend

    command: >

      sh -c "

      python manage.py migrate &&

      daphne -b 0.0.0.0 -p 8000 gsbackend.asgi:application

      "

    volumes:

      - ./gsbackend:/app

      - /home/serverAdmin/apps/gestion-des-stages-productions/gsbackend/media:/app/media

      - /home/serverAdmin/apps/gestion-des-stages-productions/gsbackend/staticfiles:/app/staticfiles

    ports:

      - "8000:8000"

    environment:

      DOCKERIZED: "true"

      DB_HOST: db

      DB_PORT: 3306

      DB_USER: root

      DB_PASSWORD: ${DB_PASSWORD}

      DB_NAME: ${DB_NAME}

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

      DJANGO_DEBUG: ${DJANGO_DEBUG}

      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend,185.158.5.60,api.cebnet.org
      CSRF_TRUSTED_ORIGINS: https://api.cebnet.org,https://stageemploi.cebnet.org
      CORS_ALLOWED_ORIGINS: https://stageemploi.cebnet.org,https://api.cebnet.org
      FRONTEND_URL: https://stageemploi.cebnet.org
      MEDIA_URL: https://api.cebnet.org/media/

      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}

      EMAIL_PORT: ${EMAIL_PORT:-587}

      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}

      EMAIL_HOST_USER: ${EMAIL_HOST_USER}

      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}

      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-${EMAIL_HOST_USER}}

      USE_X_FORWARDED_HOST: "True"

      SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https


    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_healthy

    restart: unless-stopped


# ======================

# VOLUMES

# ======================

volumes:

  mysql_data:




